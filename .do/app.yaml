# Spec de DigitalOcean App Platform para coolway-smoke.
#
# Uso:
#   1. Sube este repo a GitHub y ajusta `github.repo` / `github.branch` abajo.
#   2. En DO: Apps > Create App > "Import from App Spec" (o `doctl apps create --spec .do/app.yaml`).
#   3. Rellena los valores SECRET (contraseña y claves de Spaces) en el panel de DO,
#      NO los pongas aquí en claro.
#
# Construye con el Dockerfile del repo (imagen de Playwright con navegadores incluidos).
name: coolway-smoke
region: fra
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: PabloS-coolway/smoke-test
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs # 1 vCPU / 1 GB; Playwright/Chromium necesita algo de RAM
    health_check:
      # Endpoint PÚBLICO (no exige login). Ojo: no apuntar a rutas con requireAuth,
      # devolverían 401 y DO marcaría el deploy como no-sano.
      http_path: /api/session
    envs:
      - key: STORE_EU_URL
        scope: RUN_TIME
        value: https://www.coolway.com
      - key: STORE_US_URL
        scope: RUN_TIME
        value: https://coolway-us.com
      # Contraseña opcional para lanzar tests (déjala vacía para abrir a todos).
      - key: SMOKE_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: "" # <-- ponla en el panel de DO
      # --- Historial duradero en DO Spaces ---
      - key: SPACES_ENDPOINT
        scope: RUN_TIME
        value: https://fra1.digitaloceanspaces.com
      - key: SPACES_REGION
        scope: RUN_TIME
        value: fra1
      - key: SPACES_BUCKET
        scope: RUN_TIME
        value: coolway-smoke # <-- nombre de tu Space
      - key: SPACES_KEY
        scope: RUN_TIME
        type: SECRET
        value: "" # <-- clave de Spaces, en el panel de DO
      - key: SPACES_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "" # <-- secreto de Spaces, en el panel de DO
